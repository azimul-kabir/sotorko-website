name: Check and deploy

# On every push to main: rebuild the pages, check them, and publish to GitHub Pages.
# On pull requests: the same checks, but nothing is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild the pages
        run: python3 build.py

      - name: Make sure the committed pages match a fresh build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The generated pages are out of date. Run 'python3 build.py' and commit the result."
            git status --short
            git --no-pager diff --stat
            exit 1
          fi

      - name: Check links, anchors and basics
        run: python3 scripts/check_site.py

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Collect only what the site serves
        run: |
          mkdir _site
          cp -R index.html 404.html en privacy assets sitemap.xml robots.txt CNAME .nojekyll _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
